name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Ubuntu 24.04 runner image ships the Android SDK; just accept its licences.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Prepare signing key
        env:
          LDC_KEYSTORE_B64: ${{ secrets.LDC_KEYSTORE_B64 }}
        run: |
          if [ -z "$LDC_KEYSTORE_B64" ]; then
            echo "::error::Secret LDC_KEYSTORE_B64 is missing. Every build must be signed with the same key."
            exit 1
          fi
          echo "$LDC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ldc.jks"

      - name: Build signed APK
        working-directory: android
        env:
          LDC_KEYSTORE: ${{ runner.temp }}/ldc.jks
          LDC_KEYSTORE_PASSWORD: ${{ secrets.LDC_KEYSTORE_PASSWORD }}
          LDC_KEY_ALIAS: livrodecontas
          LDC_KEY_PASSWORD: ${{ secrets.LDC_KEYSTORE_PASSWORD }}
          LDC_VERSION_CODE: ${{ github.run_number }}
          LDC_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the end of the log as an annotation, readable without downloading logs.
            grep -n -E "What went wrong|error:|FAILURE|Exception|Could not" "$RUNNER_TEMP/gradle.log" | head -40 > "$RUNNER_TEMP/gradle.err" || true
            tail -60 "$RUNNER_TEMP/gradle.log" >> "$RUNNER_TEMP/gradle.err"
            msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/gradle.err" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::${msg}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/livro-de-contas-1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: livro-de-contas-apk
          path: ${{ runner.temp }}/livro-de-contas-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "$RUNNER_TEMP"/livro-de-contas-*.apk \
            --title "Livro de Contas 1.${{ github.run_number }}" \
            --notes "APK assinado, gerado a partir de ${{ github.sha }}."
