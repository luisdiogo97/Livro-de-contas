name: Página para PC

# Publishes the same app (www/) on GitHub Pages, so it can be used in a computer's
# browser: https://luisdiogo97.github.io/Livro-de-contas/
# The data never goes here: it stays in each browser and in the person's own Google Drive.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Same version number as the Android release built from this commit.
      - name: Version number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?head_sha=${{ github.sha }}&per_page=1" --jq '.workflow_runs[0].run_number // empty' || true)
          echo "LDC_VERSION=${n:+1.$n}" >> "$GITHUB_ENV"
      - run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
