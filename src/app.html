<style>
/* Layout: one phone-width column with a bottom tab bar; wider screens get a two-column grid inside each view. */
:root {

  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --ink: #edf0f5; --ink-2: #b9c1ce; --muted: #8790a1;
    --line: #29303b; --accent: #6b9af0; --accent-soft: #1c2a44; --on-accent: #0e1116;
    --good: #4cc08a; --good-soft: #15291f; --warn: #e2a64a; --warn-soft: #2e2414; --bad: #ef7a6c; --bad-soft: #33191a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #232933; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --ink: #edf0f5; --ink-2: #b9c1ce; --muted: #8790a1;
  --line: #29303b; --accent: #6b9af0; --accent-soft: #1c2a44; --on-accent: #0e1116;
  --good: #4cc08a; --good-soft: #15291f; --warn: #e2a64a; --warn-soft: #2e2414; --bad: #ef7a6c; --bad-soft: #33191a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #232933; color-scheme: dark;
}

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); }

  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* budget bars */

.bud:last-child { border-bottom: 0; }
.bud .top { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9rem; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--line); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
td .bar { height: 5px; background: var(--s1); border-radius: 99px; margin-top: 3px; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 16px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-2); margin-bottom: 6px; }

#tip[hidden], #toast[hidden] { display: none; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 7px 10px; border-radius: 9px; max-width: 240px; white-space: pre-line; box-shadow: 0 4px 14px rgba(0,0,0,.2); font-variant-numeric: tabular-nums; }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav b { font-family: var(--font-display); font-size: 1.15rem; text-transform: capitalize; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.iconbtn:disabled { opacity: .35; cursor: default; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }

.empty { color: var(--muted); font-size: 0.9rem; padding: 10px 0; }
.acc { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.acc:last-child { border-bottom: 0; }
.acc .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.acc .head b { font-size: 1rem; }
.acc .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; color: var(--ink-2); }
.edit { display: grid; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 12px; }
.catrow { display: grid; grid-template-columns: 1fr 96px 120px 34px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }

.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; width: 34px; height: 34px; border-radius: 8px; }
.x:hover { background: var(--surface-2); }
/* home */
.hello { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 4px 0 16px; }
.hello h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
.hello .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
.home-hero { border-radius: 22px; padding: 20px; color: #fff; display: grid; gap: 14px; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, #3f86f0 0%, #1f5fd1 45%, #173f9a 100%); box-shadow: 0 10px 28px -12px rgba(31,95,209,.55); }
.home-hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,.07); }
.home-hero .lbl { font-size: 0.82rem; font-weight: 600; opacity: .85; display: flex; justify-content: space-between; gap: 8px; }
.home-hero .big { font-family: var(--font-display); font-weight: 700; font-size: 2.5rem; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.home-hero .of { font-size: 0.9rem; opacity: .85; margin-top: 4px; }
.home-hero .meter { height: 10px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; position: relative; z-index: 1; }
.home-hero .meter i { display: block; height: 100%; border-radius: 99px; background: #fff; }
.home-hero .meter i.over { background: #ffb4a8; }

.home-hero .foot strong { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.qa { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 8px; }
.qa button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }

<div class="wrap" id="app" aria-live="polite">
  <header class="top"><h1>Livro de Contas</h1><span class="sub">A carregar os seus dados…</span></header>
  <div class="card"><p class="empty">Os seus movimentos, orçamentos, contas e ETFs aparecem aqui assim que a ligação aos dados estiver pronta.</p></div>
</div>

<script>
(() => {
'use strict';
// ---------- formatting ----------
const fEur = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const fEur0 = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fPct = new Intl.NumberFormat('pt-PT', { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fPct2 = new Intl.NumberFormat('pt-PT', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = v => fEur.format(v || 0), eur0 = v => fEur0.format(Math.round(v || 0)), pct = v => (isFinite(v) ? fPct.format(v) : '–'), pct2 = v => (isFinite(v) ? fPct2.format(v) : '–');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today = () => isoOf(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthKey = s => s.slice(0, 7);
const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); const dt = new Date(y, m - 1 + n, 1); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; };
const monthLong = key => new Intl.DateTimeFormat('pt-PT', { month: 'long', year: 'numeric' }).format(parseD(key + '-01'));
const monthShort = key => new Intl.DateTimeFormat('pt-PT', { month: 'short' }).format(parseD(key + '-01')).replace('.', '') + ' ' + key.slice(2, 4);
const dayLong = s => new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }).format(parseD(s));
const dayShort = s => new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'short' }).format(parseD(s)).replace('.', '');
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const parseAmount = s => { s = String(s || '').trim().replace(/\s|€/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };
const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const TYPES = ['Despesa', 'Conta fixa', 'Receita', 'Poupança', 'Dívida'];
const SPEND = ['Despesa', 'Conta fixa', 'Dívida'];
const CAPN = { 'Diária': 365, 'Mensal': 12, 'Trimestral': 4, 'Semestral': 2, 'Anual': 1, 'Nenhuma': 1 };
const WEEK = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

// ---------- state ----------
const S = { months: {}, cats: [], settings: { irs: 0.28, inflation: 0.02, fgd: 100000, nextContribution: 200 }, accounts: { accounts: [], history: [] }, etfs: { etfs: [], snaps: [] }, loaded: { tx: false, categories: false }, dbState: 'pending' };
let view = 'inicio';
let curMonth = monthKey(today());
let yearSel = 'last12';
const F = { type: 'Despesa', amount: '', cat: '', date: today(), note: '', editing: null, confirmDel: false };
const UI = { openAcc: null, confirmAcc: null, recentMonths: 0, addCatType: 'Despesa', pendingRestore: null, etfOpen: null, confirmEtf: false };
let db = null, host = { kind: 'none', saveFile: null };
const offMsg = () => host.kind === 'app' ? 'Não foi possível abrir os dados guardados neste telemóvel. Feche e volte a abrir a app.' : 'Sem ligação aos dados guardados. Abra esta página com a sua conta claude.ai para ver e registar movimentos.';

const catType = name => (S.cats.find(c => c.name === name) || {}).type || 'Despesa';

function accCalc(a) {
  const n = CAPN[a.cap] || 1, tanl = (+a.tanb || 0) * (a.irs ? 1 - S.settings.irs : 1);
  const eff = a.cap === 'Nenhuma' ? tanl : Math.pow(1 + tanl / n, n) - 1;
  const year = (+a.balance || 0) * eff;
  return { tanl, eff, year, month: year / 12, real: (1 + eff) / (1 + S.settings.inflation) - 1 };
}
function etfCalc() {
  const snaps = S.etfs.snaps || [];
  const rows = (S.etfs.etfs || []).map(e => {
    const mine = snaps.filter(s => s.e === e.key).sort((a, b) => a.d.localeCompare(b.d));
    const inv = mine.reduce((s, x) => s + (+x.inv || 0), 0);
    const last = mine[mine.length - 1];
    const val = last ? +last.val : 0;
    const gain = val - inv, g = inv ? gain / inv : NaN;
    let yrs = 0; if (last && inv) yrs = mine.reduce((s, x) => s + (+x.inv || 0) * (parseD(last.d) - parseD(x.d)) / 864e5, 0) / inv / 365;
    const ann = yrs > 0.08 ? Math.pow(1 + g, 1 / yrs) - 1 : NaN;
    return { ...e, inv, val, gain, g, ann, lastD: last ? last.d : null };
  });
  const totV = rows.reduce((s, r) => s + r.val, 0), totI = rows.reduce((s, r) => s + r.inv, 0);
  const next = +S.settings.nextContribution || 0;
  const need = rows.map(r => Math.max(0, (r.target || 0) * (totV + next) - r.val)), needSum = need.reduce((a, b) => a + b, 0);
  rows.forEach((r, i) => { r.w = totV ? r.val / totV : 0; r.sug = needSum ? next * need[i] / needSum : 0; });
  // evolution: per unique date, sum of last known values / cumulative invested
  const dates = [...new Set(snaps.map(s => s.d))].sort();
  const evo = dates.map(d => {
    let v = 0, iv = 0;
    for (const e of rows) { const m = snaps.filter(s => s.e === e.key && s.d <= d); if (m.length) { v += +m.sort((a, b) => a.d.localeCompare(b.d))[m.length - 1].val; iv += m.reduce((s, x) => s + (+x.inv || 0), 0); } }
    return { d, v, iv };
  });
  return { rows, totV, totI, evo };
}

    <div class="grid2">${['Despesa', 'Conta fixa'].map(block).join('')}</div>

      <section class="card stack"><h2>Parâmetros</h2>

        <div class="row2"><div class="field"><label class="small" for="set-infl">Inflação anual esperada (%)</label><input id="set-infl" class="inp" inputmode="decimal" value="${esc(String(+(s.inflation * 100).toFixed(2)).replace('.', ','))}"></div>
        <div class="field"><label class="small" for="set-irs">IRS sobre juros (%)</label><input id="set-irs" class="inp" inputmode="decimal" value="${esc(String(+(s.irs * 100).toFixed(2)).replace('.', ','))}"></div></div>
        <p class="small muted">A inflação de 2% é o objetivo do BCE; atualize com a previsão mais recente do Banco de Portugal. Os juros de depósitos em Portugal têm retenção de 28%.</p>

}

function welcomeCard() {

function backupCard() {

    <p class="small muted">${app ? 'Os dados ficam só neste telemóvel. Guarde uma cópia de vez em quando (por exemplo no Google Drive) para não os perder se mudar ou perder o telemóvel.' : 'Guarde uma cópia completa dos dados num ficheiro. Serve também para passar tudo para a app Android.'}</p>

    <h2 style="margin-top:6px">Exportar para Excel</h2>

  </section>`;

function snapshotAll() {
  const docs = {};
  for (const [k, items] of Object.entries(S.months)) docs['tx/' + k] = { items };
  docs['config/categories'] = { cats: S.cats };
  docs['config/settings'] = S.settings;
  docs['config/accounts'] = S.accounts;
  docs['config/etfs'] = S.etfs;
  return { app: 'livro-de-contas', format: 1, exportedAt: new Date().toISOString(), docs: JSON.parse(JSON.stringify(docs)) };
}
async function doBackup() {
  const d = today();
  const prev = S.settings.lastBackup;
  S.settings.lastBackup = d;
  try {
    await host.saveFile(`livro-de-contas-copia-${d}.json`, JSON.stringify(snapshotAll()), 'application/json');
    saveSettings(); render(); toast('Cópia criada');
  } catch (e) { S.settings.lastBackup = prev; toast('A cópia foi cancelada ou não está disponível.'); }
}
function readRestoreFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.app !== 'livro-de-contas' || !j.docs || typeof j.docs !== 'object') throw 0;
      const tx = Object.entries(j.docs).filter(([k]) => /^tx\/\d{4}-\d{2}$/.test(k)).flatMap(([, v]) => (v && v.items) || []);
      const ds = tx.map(x => x.d).filter(Boolean).sort();
      UI.pendingRestore = { data: j, count: tx.length, from: ds[0], to: ds[ds.length - 1] }; render();
    } catch (e) { toast('Este ficheiro não é uma cópia do Livro de Contas.'); }
  };
  r.readAsText(file);
}
async function doRestore() {
  const docs = UI.pendingRestore.data.docs; UI.pendingRestore = null;
  const writes = [];
  for (const k of Object.keys(S.months)) if (!docs['tx/' + k]) writes.push(db.doc('tx/' + k).delete());
  for (const [path, data] of Object.entries(docs)) {
    if (!/^(tx\/\d{4}-\d{2}|config\/(categories|settings|accounts|etfs))$/.test(path) || !data || typeof data !== 'object') continue;
    writes.push(writeDoc(path, data));
  }
  render();
  try { await Promise.all(writes); toast('Dados importados'); } catch (e) { toast('Não foi possível importar todos os dados. Tente outra vez.'); }
}

// ---------- render ----------
const ICONS = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"/></svg>',
  registar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  mes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  ano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>',
  patrimonio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-5 8 5M6 10v8M10 10v8M14 10v8M18 10v8M4 20h16"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
const TABS = [['inicio', 'Início'], ['registar', 'Registar'], ['mes', 'Mês'], ['ano', 'Ano'], ['patrimonio', 'Património']];
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" ${view === k ? 'aria-current="page"' : ''}>${ICONS[k]}<span>${l}</span></button>`).join('');
}
function render() {
  if (!S.loaded.tx || !S.loaded.categories) { renderTabs(); return; }
  const a = document.activeElement, aid = a && a.id, sel = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  const html = (S.dbState === 'off' ? '<div class="banner">' + offMsg() + '</div>' : '') +
    ({ inicio: viewInicio, registar: viewRegistar, mes: viewMes, ano: viewAno, patrimonio: viewPatrimonio, ajustes: viewAjustes }[view])();
  document.getElementById('app').innerHTML = html;
  renderTabs();
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
function go(v) { view = v; F.confirmDel = false; render(); window.scrollTo(0, 0); try { localStorage.setItem('ldc-view', v); } catch (e) {} }

// ---------- events ----------
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
const app = document.getElementById('app');
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'goto') { go(v); return; }
  if (act === 'quick') { resetForm(); F.type = v; go('registar'); const el = document.getElementById('f-amount'); if (el) el.focus(); return; }
  if (act === 'type') { F.type = v; if (catType(F.cat) !== v) F.cat = ''; render(); }
  else if (act === 'cat') { F.cat = F.cat === v ? '' : v; render(); }
  else if (act === 'date') { F.date = v; render(); }
  else if (act === 'more-recent') { UI.recentMonths = UI.recentMonths ? UI.recentMonths + 1 : 2; render(); }
  else if (act === 'less-recent') { UI.recentMonths = 0; render(); }
  else if (act === 'edit') { const t = findTx(b.dataset.id); if (!t) return; Object.assign(F, { editing: t.id, type: catType(t.c), amount: String(t.v).replace('.', ','), cat: t.c, date: t.d, note: t.n || '', confirmDel: false }); go('registar'); }
  else if (act === 'cancel-edit') { resetForm(); render(); }
  else if (act === 'del-edit') {
    if (!F.confirmDel) { F.confirmDel = true; render(); return; }
    const old = findTx(F.editing); resetForm(); if (!old) { render(); return; } removeTx(old.id);
    toast(`Apagado: ${old.c} ${eur(old.v)}`, { label: 'Desfazer', fn: () => addTx(old) });
  }
  else if (act === 'prev-m') { curMonth = addMonths(curMonth, -1); render(); }
  else if (act === 'next-m') { curMonth = addMonths(curMonth, 1); render(); }
  else if (act === 'year') { yearSel = v; render(); }
  else if (act === 'acc-open') { UI.openAcc = b.dataset.id; UI.confirmAcc = null; render(); }
  else if (act === 'acc-close') { UI.openAcc = null; render(); }
  else if (act === 'etf-add') { UI.etfOpen = 'new'; UI.confirmEtf = false; render(); const el = document.getElementById('etfd-key'); if (el) el.focus(); }
  else if (act === 'etf-open') { UI.etfOpen = b.dataset.key; UI.confirmEtf = false; render(); }
  else if (act === 'etf-close') { UI.etfOpen = null; UI.confirmEtf = false; render(); }
  else if (act === 'etf-del') {
    if (!UI.confirmEtf) { UI.confirmEtf = true; render(); return; }
    const k = b.dataset.key; S.etfs.etfs = S.etfs.etfs.filter(e => e.key !== k); S.etfs.snaps = S.etfs.snaps.filter(x => x.e !== k);
    UI.etfOpen = null; UI.confirmEtf = false; saveEtfs(); render(); toast(`ETF removido: ${k}`);
  }
  else if (act === 'acc-add') { const id = 'a' + Date.now().toString(36); S.accounts.accounts.push({ id, bank: 'Novo banco', product: 'Conta poupança', balance: 0, tanb: 0, cap: 'Mensal', irs: true }); UI.openAcc = id; render(); }
  else if (act === 'acc-del') {
    if (UI.confirmAcc !== b.dataset.id) { UI.confirmAcc = b.dataset.id; render(); return; }
    S.accounts.accounts = S.accounts.accounts.filter(a => a.id !== b.dataset.id); UI.openAcc = null; recordHistory(); saveAccounts(); render();
  }
  else if (act === 'cat-del') { const i = +b.dataset.i; const c = S.cats[i]; S.cats.splice(i, 1); saveCats(); render(); toast(`Categoria removida: ${c.name}`, { label: 'Desfazer', fn: () => { S.cats.splice(i, 0, c); saveCats(); render(); } }); }
  else if (act === 'export') exportXlsx();
  else if (act === 'backup') doBackup();
  else if (act === 'restore-ok') doRestore();
  else if (act === 'restore-cancel') { UI.pendingRestore = null; render(); }
});
app.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'f-amount') { F.amount = e.target.value; refreshSave(); }
  else if (id === 'f-note') F.note = e.target.value;
});
app.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'f-date') { if (t.value) { F.date = t.value; render(); } }
  else if (id === 'next-contrib') { const v = parseAmount(t.value); if (v >= 0) { S.settings.nextContribution = v; saveSettings(); render(); } }
  else if (id === 'set-name') { S.settings.name = t.value.trim(); saveSettings(); }
  else if (id === 'set-infl' || id === 'set-irs') { const v = parseAmount(t.value); if (v >= 0) { S.settings[id === 'set-infl' ? 'inflation' : 'irs'] = v / 100; saveSettings(); render(); } }
  else if (id === 'nc-type') UI.addCatType = t.value;
  else if (id === 'restore-file') { if (t.files && t.files[0]) readRestoreFile(t.files[0]); }
  else if (t.dataset.cat != null) {
    const c = S.cats[+t.dataset.cat]; if (!c) return;
    if (t.dataset.f === 'budget') { const v = t.value.trim() === '' ? 0 : parseAmount(t.value); if (!(v >= 0)) { toast('Orçamento inválido: use um número, ex.: 120 ou 45,50.'); return; } c.budget = v; }
    else c.nature = t.value;
    saveCats();
  }
});
function refreshSave() {
